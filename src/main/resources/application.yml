spring:
  datasource:
    hikari:
      max-lifetime: 540000
      keepalive-time: 300000
      connection-timeout: 30000
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB

springdoc:
  swagger-ui:
    tags-sorter: alpha

server:
  port: ${PORT:8080}

jwt:
  secret: ${JWT_SECRET:roomlog-secret-key-must-be-at-least-32-characters-long}
  expiration: 86400000
  refresh-expiration: 1209600000

ai:
  api-key: ${AI_API_KEY:roomlog-ai-secret-key}
  server-url: ${AI_SERVER_URL:http://43.205.192.197}
  callback-base-url: ${AI_CALLBACK_BASE_URL:http://localhost:8080}  # 프로덕션: https://roomlog-server-production.up.railway.app

kakao:
  api-key: ${KAKAO_API_KEY}
